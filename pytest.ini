[pytest]

testpaths = tests


browser = chromium


viewport = 1280x720


timeout = 60000

# Capture video & screenshot saat test gagal, untuk debugging.
video = retain-on-failure
screenshot = only-on-failure



# ---------------------------------------------------------------------------
# Output & reporting
# ---------------------------------------------------------------------------
# Output verbose: tampilkan nama test yang berjalan.
verbosity_test_cases = 2

# Report HTML di folder test-results
addopts = --html=test-results/report.html --self-contained-html
